<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}GOS Academy – Trợ giảng AI{% endblock %}</title>
<style nonce="{{ nonce }}">
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --line:#e3e6eb; --accent:#2563eb;
          --ok:#16a34a; --warn:#d97706; --bad:#dc2626; --info:#7c3aed; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header.top { display:flex; flex-wrap:wrap; gap:12px; align-items:center; padding:12px 16px; background:var(--card); border-bottom:1px solid var(--line); }
  header.top h1 { font-size:16px; margin:0 12px 0 0; }
  header.top nav a { color:var(--accent); text-decoration:none; margin-right:12px; }
  main { padding:16px; max-width:1400px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:16px; }
  .card h2 { font-size:15px; margin:0 0 10px; }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  input, select, textarea, button { font:inherit; }
  input, select, textarea { border:1px solid var(--line); border-radius:6px; padding:6px 8px; background:#fff; color:var(--ink); }
  textarea { width:100%; min-height:90px; resize:vertical; }
  button { border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:6px; padding:6px 12px; cursor:pointer; }
  button.secondary { background:#fff; color:var(--accent); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .muted { color:var(--muted); }
  .msg { margin-top:8px; min-height:1.2em; }
  .msg.err { color:var(--bad); } .msg.ok { color:var(--ok); }
  .badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; border:1px solid var(--line); background:#f2f4f7; white-space:nowrap; }
  .b-answer { background:#dcfce7; border-color:#bbf7d0; } .b-partial { background:#fef3c7; border-color:#fde68a; }
  .b-handoff { background:#ffedd5; border-color:#fed7aa; } .b-refusal { background:#fee2e2; border-color:#fecaca; }
  .b-error { background:#fee2e2; border-color:#fecaca; } .b-instructor { background:#ede9fe; border-color:#ddd6fe; }
  .b-notice { background:#e0f2fe; border-color:#bae6fd; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  tr.clickable { cursor:pointer; } tr.clickable:hover, tr.selected { background:#eff6ff; }
  pre { white-space:pre-wrap; word-break:break-word; background:#f8fafc; border:1px solid var(--line); border-radius:6px; padding:8px; margin:0; font-size:12px; }
  .pre { white-space:pre-wrap; word-break:break-word; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <h1>GOS Academy · Trợ giảng AI</h1>
  <nav><a href="/admin/ui">Quản trị</a><a href="/demo">Demo</a></nav>
  <span class="row">
    <label for="admin-key" class="muted">Khóa truy cập</label>
    <input id="admin-key" type="password" autocomplete="off" placeholder="khóa quản trị hoặc giảng viên">
    <button id="save-key" class="secondary" type="button">Lưu</button>
    <span id="key-state" class="muted"></span>
  </span>
  <span id="whoami" class="badge"></span>
</header>
<main>{% block content %}{% endblock %}</main>
{% include "_helpers.html" %}
<script nonce="{{ nonce }}">
  const keyInput = document.getElementById("admin-key");
  keyInput.value = store.get();
  document.getElementById("key-state").textContent = store.get() ? "đã có khóa" : "chưa có khóa";
  document.getElementById("save-key").addEventListener("click", () => {
    store.set(keyInput.value.trim());
    document.getElementById("key-state").textContent = store.get() ? "đã lưu" : "chưa có khóa";
    document.dispatchEvent(new Event("keychange"));
  });
  // Who does this key belong to? The server decides the role from the key itself (D-83).
  let ME = null;
  async function whoami() {
    const el = document.getElementById("whoami");
    ME = null; el.textContent = "";
    if (!store.get()) return null;
    try {
      ME = await (await api("/admin/me")).json();
      el.textContent = ME.role === "admin" ? "Quản trị · mọi lớp" : "Giảng viên · " + ME.class_id;
      el.className = "badge " + (ME.role === "admin" ? "b-notice" : "b-instructor");
    } catch (e) { el.textContent = e.message; el.className = "badge b-refusal"; }
    return ME;
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
