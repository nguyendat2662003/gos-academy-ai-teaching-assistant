[project]
name = "gos-teaching-assistant"
version = "0.1.0"
description = "GOS Academy AI Teaching Assistant (MVP) — class-scoped RAG answering student questions from (simulated) Zalo groups."
requires-python = ">=3.11,<3.12"
dependencies = [
    # API
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    # DB
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    # Queue / cache
    "redis>=5.0",
    "arq>=0.26",
    # Parsing
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    # LLM providers
    "google-genai>=1.0",
    "openai>=1.40",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.isort]
# The local ./alembic folder holds migrations; the `alembic` package itself is third-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# fake secrets in tests are intentional; reading small fixture files synchronously is fine in tests
"tests/**" = ["S105", "S106", "ASYNC240"]
# LLM prompts are Vietnamese prose; hard-wrapping them at 110 columns hurts review.
"app/agent/prompts.py" = ["E501"]
# Student-facing Vietnamese sentences; S105 misreads names like SECRET_WARNING as passwords.
"app/agent/messages.py" = ["E501", "S105"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "db: needs the PostgreSQL test database (docker compose up -d postgres redis)",
]
