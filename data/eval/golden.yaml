# Evaluation set for scripts/eval_rag.py.
#
# These are evaluation QUESTIONS written against the HR sample material; the material itself is untouched.
#   expect:   answer | partial | handoff | refused   (what the bot should do)
#   sections: section codes that contain the answer (hit@k: at least one must be retrieved; citations: at least
#             one cited chunk must come from them). Empty for questions that must NOT be answered.
#   reason:   expected handoff reason when it matters (policy questions are decided before retrieval).
#   kind:     material | not_in_material | other_class | policy | injection  (for the per-kind breakdown)
# The leak check needs no labels: every retrieved chunk must belong to the asking class or COMMON.

version: 1
items:
  # ---------------------------------------------------------------- GS-KPI-01: answerable
